name: Auto Sync Upstream

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0点（北京时间 8:00）自动运行
  workflow_dispatch:     # 支持在 Actions 页面手动点击按钮随时同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull upstream changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kure29/flyx.git
          git fetch upstream
          git checkout main || git checkout master
          git merge upstream/main || git merge upstream/master
          git push origin HEAD
